<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool Shot Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #18211f;
  --ink-2: #4c5955;
  --ink-3: #75817d;
  --paper: #eceff0;
  --paper-2: #e2e7e6;
  --surface: #fafbfb;
  --rule: #c5cecb;
  --chalk: #2c64a4;
  --chalk-ink: #1f4f86;
  --chalk-soft: #d9e5f2;
  --rust: #b0442a;
  --rust-soft: #f4dcd3;
  --ok: #2c7a4d;
  --ok-soft: #d7ecdf;
  --amber: #a46a07;
  --amber-soft: #f6e7c8;
  --stage: #222a28;
  --stage-2: #2b3431;
  --radius: 4px;
  --f-ui: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-head: "Barlow Semi Condensed", "Barlow", "Arial Narrow", "Segoe UI", sans-serif;
  font-size: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.4; }
body { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }

.app {
  display: grid; height: 100vh; min-height: 640px;
  grid-template-columns: 330px minmax(0, 1fr) 340px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top top" "left stage right";
}
.app.left-collapsed { grid-template-columns: 0 minmax(0, 1fr) 340px; }
.app.left-collapsed .panel.left { display: none; }

/* top bar */
.topbar { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--paper); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; margin-right: 6px; }
.brand-mark { width: 26px; height: 26px; }
.brand h1 { font-family: var(--f-head); font-weight: 700; font-size: 21px; letter-spacing: 0.01em; margin: 0; }
.topbar-group { display: flex; gap: 6px; align-items: center; }
.topbar .units { margin-left: auto; }

button { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 5px 10px; cursor: pointer; line-height: 1.2; }
button:hover { border-color: var(--ink-3); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--chalk); border-color: var(--chalk-ink); color: #fff; font-weight: 600; }
button.primary:hover { background: var(--chalk-ink); }
button.ghost { background: transparent; }
button.danger { color: var(--rust); }
button.small { padding: 2px 7px; font-size: 12.5px; }
select, input[type=number], input[type=text], textarea { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 4px 6px; min-width: 0; }
input[type=number] { width: 86px; }
input[type=range] { accent-color: var(--chalk); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--rule); background: var(--surface); padding: 4px 9px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--paper); }

/* side panels */
.panel { background: var(--paper); display: flex; flex-direction: column; min-height: 0; }
.panel.left { grid-area: left; border-right: 1px solid var(--rule); }
.panel.right { grid-area: right; border-left: 1px solid var(--rule); }
.panel-head { display: flex; align-items: flex-end; border-bottom: 1px solid var(--rule); padding: 0 8px; background: var(--paper-2); }
.tabs { display: flex; gap: 2px; flex: 1; }
.tabs button { border: 0; border-radius: 0; background: transparent; padding: 9px 9px 7px; font-family: var(--f-head); font-weight: 600; font-size: 15px; color: var(--ink-2); border-bottom: 3px solid transparent; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--chalk); }
.collapse { border: 0; background: transparent; font-size: 18px; padding: 6px 8px; color: var(--ink-2); }
.expand-left { position: fixed; left: 0; top: 50%; z-index: 5; border-radius: 0 var(--radius) var(--radius) 0; padding: 14px 4px; }
.panel-body { overflow-y: auto; flex: 1; min-height: 0; padding: 4px 14px 24px; }
.tabpane h2 { font-family: var(--f-head); font-weight: 600; font-size: 16.5px; margin: 16px 0 6px; }
.tabpane h3 { font-family: var(--f-head); font-weight: 600; font-size: 14.5px; margin: 12px 0 4px; color: var(--ink-2); }
.tabpane p { margin: 4px 0 8px; }
.note { color: var(--ink-2); font-size: 12.5px; }
.rule { border: 0; border-top: 1px solid var(--rule); margin: 14px 0 4px; }
.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
.row > label { min-width: 0; }
.row .grow { flex: 1; }
.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; margin: 5px 0; }
.field > span { color: var(--ink-2); }
.inline-num { display: inline-flex; align-items: center; gap: 4px; }
.inline-num .u { color: var(--ink-3); font-size: 12.5px; min-width: 1.8em; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; text-align: right; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 12px; background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--rule); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: #b5d8c2; }
.chip.warn { background: var(--amber-soft); color: var(--amber); border-color: #e8cf97; }
.chip.bad { background: var(--rust-soft); color: var(--rust); border-color: #e7b9aa; }
.chip.info { background: var(--chalk-soft); color: var(--chalk-ink); border-color: #b9cde6; }
.msg { font-size: 12.5px; padding: 6px 8px; border-left: 3px solid var(--rule); background: var(--surface); margin: 6px 0; }
.msg.bad { border-left-color: var(--rust); }
.msg.warn { border-left-color: var(--amber); }
.msg.ok { border-left-color: var(--ok); }

/* ball cards in layout */
.ballrow { border-top: 1px solid var(--rule); padding: 8px 0 6px; }
.ballrow:first-of-type { border-top: 0; }
.ballrow .head { display: flex; align-items: center; gap: 8px; }
.swatch { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.45); flex: none; }
.ballrow .name { font-weight: 600; flex: 1; }
.coords { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 6px; align-items: center; margin-top: 6px; }
.coords input { width: 100%; }
.coords span { color: var(--ink-2); font-size: 12.5px; }

/* stage */
.stage-col { grid-area: stage; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--stage); }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--stage-2); color: #dfe6e3; flex-wrap: wrap; }
.toolbar button, .toolbar .seg button { background: #36403d; border-color: #4b5653; color: #e8eeeb; }
.toolbar .seg { border-color: #4b5653; }
.toolbar .seg button { border-right-color: #4b5653; }
.toolbar .seg button[aria-pressed=true] { background: #e8eeeb; color: var(--ink); }
.tool-group { display: flex; gap: 4px; }
.toolbar-spacer { flex: 1; }
.cursor-readout { font-size: 12.5px; color: #b9c4c0; min-width: 190px; text-align: right; }
.layers-wrap { position: relative; }
.layers-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px 12px; width: 300px; box-shadow: 0 8px 24px rgba(10, 20, 18, 0.25); }
.layers-menu label { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.layers-menu .lm-sample { width: 34px; height: 10px; flex: none; }
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.legend { position: absolute; left: 10px; top: 10px; background: rgba(24, 31, 29, 0.84); color: #e6ece9; font-size: 12px; padding: 7px 10px; border-radius: var(--radius); pointer-events: none; max-width: 300px; }
.legend .li { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
.legend svg { flex: none; }
.legend .vtitle { margin-top: 5px; color: #b9c4c0; }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 7px 12px; border-radius: var(--radius); border-left: 4px solid var(--chalk); box-shadow: 0 6px 20px rgba(0,0,0,0.3); font-size: 13px; max-width: 80%; }
.toast.bad { border-left-color: var(--rust); }

/* playback */
.playback { background: var(--paper); border-top: 1px solid var(--rule); padding: 8px 12px 8px; }
.pb-buttons { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pb-buttons .rate { display: inline-flex; gap: 6px; align-items: center; margin-left: 6px; color: var(--ink-2); }
.timeline { position: relative; margin: 8px 0 2px; padding-top: 12px; }
.timeline input { width: 100%; margin: 0; }
.ticks { position: absolute; left: 8px; right: 8px; top: 0; height: 12px; }
.tick { position: absolute; top: 0; width: 7px; height: 11px; margin-left: -3.5px; border: 0; padding: 0; border-radius: 2px; cursor: pointer; }
.tick.ball { background: var(--ink); }
.tick.cushion { background: #2f8a5c; }
.tick.jaw { background: var(--rust); }
.tick.pocket { background: var(--chalk); }
.tick.sel { outline: 2px solid var(--amber); outline-offset: 1px; }
.pb-readout { display: flex; gap: 16px; align-items: baseline; font-size: 13px; }
.pb-readout #timeReadout { font-weight: 600; min-width: 72px; }
.status { color: var(--ink-2); }

/* tip widget */
.tipwrap { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; }
.tipcanvas { width: 150px; height: 150px; touch-action: none; cursor: crosshair; border-radius: 50%; }
.presets { display: flex; flex-wrap: wrap; gap: 4px; }
.readout { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 7px 9px; margin: 8px 0; font-size: 13px; }
.readout .big { font-size: 16px; font-weight: 600; }
.nudges { display: flex; gap: 3px; flex-wrap: wrap; }
.nudges button { padding: 3px 6px; font-size: 12.5px; }

/* tables */
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0; }
table.data th, table.data td { text-align: left; padding: 4px 5px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.data th { color: var(--ink-2); font-weight: 600; }
table.data td.num { text-align: right; white-space: nowrap; }
table.data tr.sel td { background: var(--chalk-soft); }
table.data tr.clickable { cursor: pointer; }
table.data tr.clickable:hover td { background: var(--paper-2); }
.def { color: var(--ink-3); font-size: 11.5px; display: block; }
.params input[type=number] { width: 78px; }
.params td.src { color: var(--ink-2); }

/* events */
.evlist { list-style: none; padding: 0; margin: 6px 0; max-height: 220px; overflow-y: auto; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
.evlist li { display: grid; grid-template-columns: 26px 62px 1fr; gap: 6px; padding: 4px 6px; border-bottom: 1px solid var(--paper-2); cursor: pointer; font-size: 12.5px; }
.evlist li:hover { background: var(--paper-2); }
.evlist li.sel { background: var(--chalk-soft); }
.evnum { display: inline-flex; width: 20px; height: 20px; border-radius: 50%; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; background: var(--ink); }
.evnum.cushion { background: #2f8a5c; }
.evnum.jaw { background: var(--rust); }
.evnum.pocket { background: var(--chalk); }

/* variants / solver */
.vrow { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: start; padding: 8px 0; border-top: 1px solid var(--rule); }
.vrow .vname { font-weight: 600; }
.vrow .vactions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.vline { width: 18px; height: 4px; margin-top: 8px; border-radius: 2px; }
.cand { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); padding: 8px 10px; margin: 8px 0; }
.cand .ctitle { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.cand .ctitle strong { font-family: var(--f-head); font-size: 15px; }
.cand .cactions { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.progress { height: 6px; background: var(--paper-2); border-radius: 3px; overflow: hidden; margin: 6px 0; }
.progress > div { height: 100%; background: var(--chalk); width: 0; transition: width 0.15s linear; }
.sweepbar { display: flex; gap: 1px; margin: 6px 0; height: 26px; }
.sweepbar button { flex: 1; padding: 0; border-radius: 0; border: 0; min-width: 4px; }
.sweepbar button.sel { outline: 2px solid var(--ink); outline-offset: -2px; }
.sw-pot { background: #3f9a67; }
.sw-potdk { background: #d6a23a; }
.sw-dk { background: #c96a3f; }
.sw-scratch { background: #7d2b1d; }
.sw-miss { background: #b9c3bf; }
.sw-miscue { background: repeating-linear-gradient(45deg, #ddd, #ddd 3px, #aaa 3px, #aaa 6px); }
.sweep-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.sweep-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }

/* checks */
.check { border-top: 1px solid var(--rule); padding: 7px 0; }
.check .ch { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.check .cname { font-weight: 600; }
.check .cdetail { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.doc h3 { margin-top: 14px; }
.doc p, .doc li { font-size: 13px; color: var(--ink); }
.doc ul { padding-left: 18px; margin: 4px 0; }

/* dialog */
dialog { border: 1px solid var(--rule); border-radius: 6px; padding: 0; max-width: min(640px, 94vw); width: 640px; background: var(--paper); color: var(--ink); }
dialog::backdrop { background: rgba(15, 22, 20, 0.45); }
.dialog-inner { padding: 16px 18px; }
.dialog-inner h2 { font-family: var(--f-head); margin: 0 0 8px; font-size: 19px; }
.dialog-inner textarea { width: 100%; min-height: 240px; font-size: 12px; }
.dialog-inner .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
.kbd { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
kbd { background: var(--surface); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; font-size: 12px; font-family: var(--f-ui); }

@media (max-width: 1180px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto auto; grid-template-areas: "top" "stage" "right" "left"; height: auto; }
  .app.left-collapsed { grid-template-columns: minmax(0, 1fr); }
  .panel.left, .panel.right { border: 0; border-top: 1px solid var(--rule); }
  .panel-body { overflow: visible; }
  .collapse, .expand-left { display: none; }
  .topbar .units { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .progress > div { transition: none; }
}

/* targets */
.targets { margin: 4px 0; }
.trow { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--rule); }
.trow:first-child { border-top: 0; }
.tsel { display: grid; grid-template-columns: minmax(0, 0.75fr) minmax(0, 1.25fr); gap: 4px; }
.tsel select { width: 100%; }
.tnum { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; background: var(--amber-soft); color: var(--amber); border: 1px solid #e8cf97; }
.tnum.active { background: #f2c14e; color: var(--ink); border-color: #c79a2a; }
.tact { display: flex; flex-direction: column; gap: 3px; align-items: stretch; }

</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="11" cy="17" r="8" fill="#f4f1e6" stroke="#18211f" stroke-width="1.5"/><circle cx="22" cy="14" r="8" fill="#f0b921" stroke="#18211f" stroke-width="1.5"/><line x1="11" y1="17" x2="22" y2="14" stroke="#18211f" stroke-width="1.2" stroke-dasharray="2 2"/></svg>
      <h1>Pool Shot Lab</h1>
    </div>
    <div class="topbar-group">
      <label class="sr-only" for="presetSelect">Load a preset scenario</label>
      <select id="presetSelect" title="Load a preset scenario"></select>
    </div>
    <div class="topbar-group" role="group" aria-label="History">
      <button id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
      <button id="redoBtn" title="Redo (Ctrl+Shift+Z)">Redo</button>
    </div>
    <div class="topbar-group" role="group" aria-label="Files">
      <button id="saveBtn" title="Save this scenario in the browser">Save</button>
      <button id="openBtn" title="Open a saved scenario">Open</button>
      <button id="exportBtn" title="Export scenario as versioned JSON">Export JSON</button>
      <button id="importBtn" title="Import a scenario JSON">Import JSON</button>
    </div>
    <div class="topbar-group units" role="group" aria-label="Display units">
      <div class="seg" id="lenUnit"><button data-v="mm" aria-pressed="true">mm</button><button data-v="in">in</button></div>
      <div class="seg" id="angUnit"><button data-v="deg" aria-pressed="true">deg</button><button data-v="rad">rad</button></div>
    </div>
    <button id="helpBtn" class="ghost" title="Keyboard shortcuts and controls">Controls</button>
  </header>

  <aside class="panel left" id="leftPanel">
    <div class="panel-head">
      <div class="tabs" role="tablist" aria-label="Analysis panels">
        <button role="tab" data-tab="layout" aria-selected="true">Layout</button>
        <button role="tab" data-tab="analysis">Analysis</button>
        <button role="tab" data-tab="physics">Physics</button>
        <button role="tab" data-tab="checks">Checks</button>
      </div>
      <button class="collapse" id="collapseLeft" title="Collapse panel" aria-label="Collapse analysis panel">‹</button>
    </div>
    <div class="panel-body">
      <section class="tabpane" data-pane="layout" id="paneLayout"></section>
      <section class="tabpane" data-pane="analysis" id="paneAnalysis" hidden></section>
      <section class="tabpane" data-pane="physics" id="panePhysics" hidden></section>
      <section class="tabpane" data-pane="checks" id="paneChecks" hidden></section>
    </div>
  </aside>
  <button class="expand-left" id="expandLeft" hidden aria-label="Show analysis panel" title="Show panel">›</button>

  <main class="stage-col">
    <div class="toolbar">
      <div class="tool-group" role="group" aria-label="View">
        <button id="fitBtn" title="Fit table (F)">Fit</button>
        <button id="zoomOut" title="Zoom out (−)" aria-label="Zoom out">−</button>
        <button id="zoomIn" title="Zoom in (+)" aria-label="Zoom in">+</button>
      </div>
      <div class="seg tool-seg" id="toolSeg" role="group" aria-label="Pointer tool">
        <button data-v="aim" aria-pressed="true" title="Drag balls, drag elsewhere to aim (Shift for fine aim)">Aim and place</button>
        <button data-v="pan" title="Drag to pan (or right-drag in any tool)">Pan</button>
        <button data-v="measure" title="Drag to measure a distance">Measure</button>
      </div>
      <div class="layers-wrap">
        <button id="layersBtn" aria-expanded="false" aria-controls="layersMenu">Layers</button>
        <div class="layers-menu" id="layersMenu" hidden></div>
      </div>
      <div class="toolbar-spacer"></div>
      <span class="cursor-readout" id="cursorReadout" aria-live="off"></span>
    </div>
    <div class="stage" id="stage">
      <canvas id="tableCanvas" aria-label="Pool table. Drag balls to place them, drag elsewhere to aim."></canvas>
      <div class="legend" id="legend"></div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <div class="playback">
      <div class="pb-buttons" role="group" aria-label="Playback">
        <button id="shootBtn" class="primary" title="Play the shot (Space)">Play shot</button>
        <button id="prevEvt" title="Previous collision ([)">Previous collision</button>
        <button id="nextEvt" title="Next collision (])">Next collision</button>
        <button id="rewindBtn" title="Back to the pre-shot layout (Home)">Pre-shot layout</button>
        <label class="rate">Speed
          <select id="rateSel"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option><option value="0.1">0.1×</option><option value="0.03">0.03×</option></select>
        </label>
        <button id="keepBtn" class="ghost" title="Use the final ball positions as the new layout">Keep result as layout</button>
      </div>
      <div class="timeline">
        <div class="ticks" id="ticks"></div>
        <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Timeline">
      </div>
      <div class="pb-readout"><span id="timeReadout">0.000 s</span><span id="statusLine" class="status"></span></div>
    </div>
  </main>

  <aside class="panel right" id="rightPanel">
    <div class="panel-head">
      <div class="tabs" role="tablist" aria-label="Shot panels">
        <button role="tab" data-tab="shot" aria-selected="true">Shot</button>

<script>
/* Pool Shot Lab: deterministic physics core.
 * Units: metres, seconds, kilograms, radians. Table frame: x along the long axis (0..L),
 * y along the short axis (0..W), z up; origin at the lower-left intersection of cushion-nose lines.
 * The factory is self-contained (no outer references) so it can be serialised into a Web Worker. */
function PoolPhysicsCore() {
  'use strict';
  const VERSION = '1.0.0';
  const S = Object.freeze({ STATIONARY: 0, SPINNING: 1, SLIDING: 2, ROLLING: 3, POCKETED: 4 });
  const STATE_NAMES = ['stationary', 'spinning', 'sliding', 'rolling', 'pocketed'];
  const IN = 0.0254;
  const EPS_U = 1e-8, EPS_V = 1e-8, EPS_W = 1e-6;
  const hyp = Math.hypot;

  /* ------------------------------------------------------------------ parameters */
  const GEOMETRY_PRESETS = {
    wpa9: {
      label: 'WPA 9-ft, corner 4.5 in, side 5 in',
      length: 100 * IN, width: 50 * IN, ballRadius: 1.125 * IN,
      cornerMouth: 4.5 * IN, sideMouth: 5 * IN, cornerAngleDeg: 142, sideAngleDeg: 104,
      cornerShelf: 1.625 * IN, sideShelf: 0.1875 * IN,
      cornerHoleRadius: 2.5 * IN, sideHoleRadius: 2.625 * IN, jawRadius: 0.125 * IN,
      cushionWidth: 2 * IN, railWidth: 4.5 * IN,
    },
    wpa9wide: {

      cornerMouth: 4.625 * IN, sideMouth: 5.125 * IN, cornerAngleDeg: 142, sideAngleDeg: 104,
      cornerShelf: 1.625 * IN, sideShelf: 0.1875 * IN,
      cornerHoleRadius: 2.5 * IN, sideHoleRadius: 2.625 * IN, jawRadius: 0.125 * IN,
      cushionWidth: 2 * IN, railWidth: 4.5 * IN,
    },
  };

  const GEOMETRY_SPECS = [
    { key: 'length', label: 'Playing length', kind: 'len', min: 1.5, max: 3.0, src: 'WPA 100 in ± 1/8 in (9-ft)' },
    { key: 'width', label: 'Playing width', kind: 'len', min: 0.75, max: 1.5, src: 'WPA 50 in ± 1/8 in (9-ft)' },
    { key: 'ballRadius', label: 'Ball radius', kind: 'len', min: 0.025, max: 0.03, src: 'WPA 2.25 in diameter' },
    { key: 'cornerMouth', label: 'Corner mouth (nose to nose)', kind: 'len', min: 0.09, max: 0.14, src: 'WPA 4.5–4.625 in' },
    { key: 'sideMouth', label: 'Side mouth (nose to nose)', kind: 'len', min: 0.10, max: 0.15, src: 'WPA 5–5.125 in' },
    { key: 'cornerAngleDeg', label: 'Corner facing angle', kind: 'deg', min: 130, max: 150, src: 'WPA 142° ± 1°' },
    { key: 'sideAngleDeg', label: 'Side facing angle', kind: 'deg', min: 95, max: 115, src: 'WPA 104° ± 1°' },
    { key: 'cornerShelf', label: 'Corner shelf depth', kind: 'len', min: 0.0, max: 0.08, src: 'WPA 1–2.25 in (selected 1.625 in)' },
    { key: 'sideShelf', label: 'Side shelf depth', kind: 'len', min: 0.0, max: 0.03, src: 'WPA 0–0.375 in (selected 0.1875 in)' },
    { key: 'cornerHoleRadius', label: 'Corner slate-hole radius', kind: 'len', min: 0.04, max: 0.09, src: 'Assumed, not in WPA spec' },
    { key: 'sideHoleRadius', label: 'Side slate-hole radius', kind: 'len', min: 0.04, max: 0.09, src: 'Assumed, not in WPA spec' },
    { key: 'jawRadius', label: 'Jaw nose rounding radius', kind: 'len', min: 0.0, max: 0.01, src: 'Assumed (≈1/8 in)' },
  ];

  const PARAM_SPECS = [
    { key: 'g', group: 'Cloth', label: 'Gravity', unit: 'm/s²', value: 9.81, min: 9.7, max: 9.9, src: 'Standard gravity', cal: true },
    { key: 'muSlide', group: 'Cloth', label: 'Ball–cloth sliding friction μs', unit: '–', value: 0.20, min: 0.10, max: 0.30, src: 'Typical literature value (Alciatore; Marlow)', cal: false },
    { key: 'muRoll', group: 'Cloth', label: 'Rolling resistance μr', unit: '–', value: 0.010, min: 0.003, max: 0.025, src: 'Typical literature range 0.005–0.015', cal: false },
    { key: 'muSpin', group: 'Cloth', label: 'Spin-decay coefficient μsp', unit: '–', value: 0.0127, min: 0.0, max: 0.05, src: 'pooltool default; ≈11 rad/s² decay', cal: false },
    { key: 'ballMass', group: 'Balls', label: 'Ball mass', unit: 'kg', value: 0.170, min: 0.150, max: 0.180, src: 'WPA 5.5–6 oz', cal: true },
    { key: 'eBall', group: 'Balls', label: 'Ball–ball restitution', unit: '–', value: 0.95, min: 0.85, max: 1.0, src: 'Typical literature value 0.92–0.98', cal: false },
    { key: 'muBallA', group: 'Balls', label: 'Ball–ball friction a (μ = a + b·e^(−c·v))', unit: '–', value: 9.951e-3, min: 0, max: 0.2, src: 'Alciatore TP A.14 fit to Marlow data', cal: false },
    { key: 'muBallB', group: 'Balls', label: 'Ball–ball friction b', unit: '–', value: 0.108, min: 0, max: 0.3, src: 'Alciatore TP A.14', cal: false },
    { key: 'muBallC', group: 'Balls', label: 'Ball–ball friction c', unit: 's/m', value: 1.088, min: 0, max: 5, src: 'Alciatore TP A.14', cal: false },
    { key: 'eCushion', group: 'Cushions', label: 'Cushion restitution at zero speed', unit: '–', value: 0.90, min: 0.5, max: 1.0, src: 'Estimate; Mathavan et al. fitted 0.98 on snooker', cal: false },
    { key: 'eCushionSlope', group: 'Cushions', label: 'Restitution loss per normal speed', unit: 's/m', value: 0.035, min: 0, max: 0.15, src: 'Estimate, represents speed dependence', cal: false },
    { key: 'eCushionMin', group: 'Cushions', label: 'Minimum cushion restitution', unit: '–', value: 0.60, min: 0.3, max: 1.0, src: 'Estimate (floor for hard shots)', cal: false },
    { key: 'muCushion', group: 'Cushions', label: 'Ball–cushion friction μw', unit: '–', value: 0.14, min: 0.0, max: 0.4, src: 'Mathavan et al. 2010 (snooker)', cal: false },
    { key: 'muTableImpact', group: 'Cushions', label: 'Ball–cloth friction during impact', unit: '–', value: 0.21, min: 0.0, max: 0.4, src: 'Mathavan et al. 2010', cal: false },
    { key: 'cushionHeight', group: 'Cushions', label: 'Nose height / ball diameter', unit: '–', value: 0.635, min: 0.5, max: 0.7, src: 'WPA 62.5–64.5%', cal: true },
    { key: 'cueMass', group: 'Cue', label: 'Cue mass', unit: 'kg', value: 0.54, min: 0.45, max: 0.65, src: 'Typical 19 oz cue', cal: true },
    { key: 'tipRestitution', group: 'Cue', label: 'Tip restitution', unit: '–', value: 0.75, min: 0.5, max: 0.95, src: 'Estimate (literature 0.7–0.85)', cal: false },
    { key: 'cueEndMass', group: 'Cue', label: 'Shaft end mass (squirt)', unit: 'kg', value: 0.008, min: 0.003, max: 0.03, src: 'Alciatore TP A.31 model; value assumed', cal: false },
    { key: 'miscueLimit', group: 'Cue', label: 'Miscue limit', unit: '×R', value: 0.5, min: 0.3, max: 0.65, src: 'Approx. 0.5 R (Alciatore)', cal: false },
    { key: 'cushionSteps', group: 'Solver', label: 'Cushion impulse steps', unit: 'steps', value: 300, min: 50, max: 5000, src: 'Numerical resolution', cal: true, int: true },
    { key: 'horizon', group: 'Solver', label: 'Prediction horizon', unit: 's', value: 60, min: 1, max: 600, src: 'Stop time if balls never rest', cal: true },
    { key: 'maxEvents', group: 'Solver', label: 'Event limit', unit: 'events', value: 3000, min: 50, max: 20000, src: 'Safety cap', cal: true, int: true },
  ];

  function defaultParams() { const p = {}; for (const s of PARAM_SPECS) p[s.key] = s.value; return p; }
  const TABLE_PRESETS = {
    standard: { label: 'Standard cloth (literature typical)', values: {} },
    fast: { label: 'Fast new cloth (estimate)', values: { muSlide: 0.18, muRoll: 0.006, muSpin: 0.010, eCushion: 0.93 } },
    slow: { label: 'Slow, worn cloth (estimate)', values: { muSlide: 0.24, muRoll: 0.016, muSpin: 0.016, eCushion: 0.86 } },
    lossless: {
      label: 'Lossless reference (validation only)',
      values: { muSlide: 0, muRoll: 0, muSpin: 0, eBall: 1, muBallA: 0, muBallB: 0, eCushion: 1, eCushionSlope: 0, eCushionMin: 1, muCushion: 0, muTableImpact: 0 },
    },
  };
  function presetParams(name) {
    const p = defaultParams(); const pr = TABLE_PRESETS[name];
    if (pr) Object.assign(p, pr.values);
    return p;
  }
  function defaultGeometry() { return Object.assign({ preset: 'wpa9' }, GEOMETRY_PRESETS.wpa9); }

  /* ------------------------------------------------------------------ geometry */
  function rot(v, a) { const c = Math.cos(a), s = Math.sin(a); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }

  function buildTable(G) {
    const L = G.length, W = G.width, rj = Math.max(0, G.jawRadius || 0);
    const dc = G.cornerMouth / Math.SQRT2, hs = G.sideMouth / 2, r2 = Math.SQRT1_2;
    const defs = [
      { id: 'BL', name: 'Lower-left corner', kind: 'corner', axis: [-r2, -r2], order: [1, 0],
        jaws: [{ p: [dc, 0], n: [0, 1], away: [1, 0] }, { p: [0, dc], n: [1, 0], away: [0, 1] }] },
      { id: 'BS', name: 'Lower side', kind: 'side', axis: [0, -1], order: [0, 1],
        jaws: [{ p: [L / 2 - hs, 0], n: [0, 1], away: [-1, 0] }, { p: [L / 2 + hs, 0], n: [0, 1], away: [1, 0] }] },
      { id: 'BR', name: 'Lower-right corner', kind: 'corner', axis: [r2, -r2], order: [0, 1],
        jaws: [{ p: [L - dc, 0], n: [0, 1], away: [-1, 0] }, { p: [L, dc], n: [-1, 0], away: [0, 1] }] },
      { id: 'TR', name: 'Upper-right corner', kind: 'corner', axis: [r2, r2], order: [1, 0],
        jaws: [{ p: [L - dc, W], n: [0, -1], away: [-1, 0] }, { p: [L, W - dc], n: [-1, 0], away: [0, -1] }] },
      { id: 'TS', name: 'Upper side', kind: 'side', axis: [0, 1], order: [1, 0],
        jaws: [{ p: [L / 2 - hs, W], n: [0, -1], away: [-1, 0] }, { p: [L / 2 + hs, W], n: [0, -1], away: [1, 0] }] },
      { id: 'TL', name: 'Upper-left corner', kind: 'corner', axis: [-r2, r2], order: [0, 1],
        jaws: [{ p: [dc, W], n: [0, -1], away: [1, 0] }, { p: [0, W - dc], n: [1, 0], away: [0, -1] }] },
    ];
    const segments = [], arcs = [], pockets = [], polygon = [];
    const mkSeg = (id, kind, name, a, b, n, pocketId) => {
      const len = hyp(b[0] - a[0], b[1] - a[1]);
      segments.push({ id, kind, name, a, b, n, d: [(b[0] - a[0]) / len, (b[1] - a[1]) / len], len, pocketId: pocketId || null });
    };
    for (const d of defs) {
      const angle = (d.kind === 'corner' ? G.cornerAngleDeg : G.sideAngleDeg) * Math.PI / 180;
      const shelf = d.kind === 'corner' ? G.cornerShelf : G.sideShelf;
      const hr = d.kind === 'corner' ? G.cornerHoleRadius : G.sideHoleRadius;
      const j0 = d.jaws[0].p, j1 = d.jaws[1].p;
      const M = [(j0[0] + j1[0]) / 2, (j0[1] + j1[1]) / 2], u = d.axis;
      const depthEnd = shelf + 1.6 * hr;
      const jaws = d.jaws.map((jw, k) => {
        const other = d.jaws[1 - k].p;
        let f = rot(jw.away, angle); if (dot(f, jw.n) > 0) f = rot(jw.away, -angle);
        let nb = [-f[1], f[0]]; if (dot([other[0] - jw.p[0], other[1] - jw.p[1]], nb) < 0) nb = [f[1], -f[0]];
        const na = jw.n, det = na[0] * nb[1] - na[1] * nb[0];
        const C = [jw.p[0] + rj * (na[1] - nb[1]) / det, jw.p[1] + rj * (nb[0] - na[0]) / det];
        const Ta = [C[0] + rj * na[0], C[1] + rj * na[1]], Tb = [C[0] + rj * nb[0], C[1] + rj * nb[1]];
        const len = depthEnd / dot(f, u);
        const E = [jw.p[0] + f[0] * len, jw.p[1] + f[1] * len];
        return { p: jw.p, n: na, f, nb, C, Ta, Tb, E };
      });
      const pk = {
        id: d.id, name: d.name, kind: d.kind, M, u, mouth: hyp(j0[0] - j1[0], j0[1] - j1[1]),
        jaws, order: d.order, shelf, angleDeg: angle * 180 / Math.PI,
        hole: { c: [M[0] + u[0] * (shelf + hr), M[1] + u[1] * (shelf + hr)], r: hr },
        aim: [M[0], M[1]],
      };
      pockets.push(pk);
      jaws.forEach((jw, k) => {
        mkSeg(d.id + '-F' + k, 'facing', d.name + ' facing', jw.Tb, jw.E, jw.nb, d.id);
        arcs.push({ id: d.id + '-J' + k, kind: 'jaw', name: d.name + ' jaw', c: jw.C, r: rj, pocketId: d.id });
      });
      mkSeg(d.id + '-K', 'back', d.name + ' back', jaws[0].E, jaws[1].E, [-u[0], -u[1]], d.id);
    }
    const P = Object.fromEntries(pockets.map(p => [p.id, p]));
    const rails = [
      ['B1', 'Lower rail, left half', P.BL.jaws[0].Ta, P.BS.jaws[0].Ta, [0, 1]],
      ['B2', 'Lower rail, right half', P.BS.jaws[1].Ta, P.BR.jaws[0].Ta, [0, 1]],
      ['R', 'Right short rail', P.BR.jaws[1].Ta, P.TR.jaws[1].Ta, [-1, 0]],
      ['T2', 'Upper rail, right half', P.TR.jaws[0].Ta, P.TS.jaws[1].Ta, [0, -1]],
      ['T1', 'Upper rail, left half', P.TS.jaws[0].Ta, P.TL.jaws[0].Ta, [0, -1]],
      ['L', 'Left short rail', P.TL.jaws[1].Ta, P.BL.jaws[1].Ta, [1, 0]],
    ];
    for (const r of rails) mkSeg(r[0], 'rail', r[1], r[2], r[3], r[4], null);
    // Playing-surface polygon including pocket throats (for rendering), counter-clockwise.
    const arcPts = (C, r, from, to) => {
      const a0 = Math.atan2(from[1] - C[1], from[0] - C[0]); let a1 = Math.atan2(to[1] - C[1], to[0] - C[0]);
      let da = a1 - a0; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
      const n = Math.max(2, Math.ceil(Math.abs(da) / 0.15)); const out = [];
      for (let i = 0; i <= n; i++) { const a = a0 + da * i / n; out.push([C[0] + r * Math.cos(a), C[1] + r * Math.sin(a)]); }
      return out;
    };
    for (const id of ['BL', 'BS', 'BR', 'TR', 'TS', 'TL']) {
      const pk = P[id], en = pk.jaws[pk.order[0]], lv = pk.jaws[pk.order[1]];
      polygon.push(...(rj > 0 ? arcPts(en.C, rj, en.Ta, en.Tb) : [en.p]));
      polygon.push(en.E, lv.E);
      polygon.push(...(rj > 0 ? arcPts(lv.C, rj, lv.Tb, lv.Ta) : [lv.p]));
    }
    const railList = segments.filter(s => s.kind === 'rail');
    return { L, W, G, segments, arcs, pockets, pocketById: P, rails: railList, railById: Object.fromEntries(railList.map(r => [r.id, r])), polygon };
  }

  /* ------------------------------------------------------------------ polynomial roots */
  function pEval(c, t) { let r = 0; for (let i = c.length - 1; i >= 0; i--) r = r * t + c[i]; return r; }
  function pDeriv(c) { const d = new Array(c.length - 1); for (let i = 1; i < c.length; i++) d[i - 1] = c[i] * i; return d; }
  function trim(c) { let n = c.length; while (n > 1 && c[n - 1] === 0) n--; return n === c.length ? c : c.slice(0, n); }
  function solveMonotone(c, dc, a, b, fa) {
    let x = 0.5 * (a + b);
    for (let it = 0; it < 100; it++) {
      const fx = pEval(c, x);
      if (fx === 0) return x;
      if ((fx < 0) === (fa < 0)) { a = x; fa = fx; } else { b = x; }
      const d = pEval(dc, x);
      let xn = d !== 0 ? x - fx / d : NaN;
      if (!(xn > a && xn < b)) xn = 0.5 * (a + b);
      if (Math.abs(xn - x) <= 1e-16 * Math.max(1, Math.abs(x)) || b - a <= 4e-16 * Math.max(1, Math.abs(a))) return xn;
      x = xn;
    }
    return x;
  }
  /** All real roots of polynomial c (ascending coefficients) in [a, b], via recursive critical-point isolation. */
  function rootsIn(c, a, b) {
    c = trim(c);
    const deg = c.length - 1, out = [];
    if (deg <= 0) return out;
    if (deg === 1) { const r = -c[0] / c[1]; if (r >= a && r <= b) out.push(r); return out; }
    const dc = pDeriv(c);
    const pts = rootsIn(dc, a, b); pts.push(b);
    let lo = a, flo = pEval(c, a);
    if (flo === 0) out.push(a);
    for (const hi of pts) {
      if (hi <= lo) continue;
      const fhi = pEval(c, hi);
      if (fhi === 0) out.push(hi);
      else if (flo !== 0 && (flo < 0) !== (fhi < 0)) out.push(solveMonotone(c, dc, lo, hi, flo));
      lo = hi; flo = fhi;
    }
    return out;
  }
  let lastPress = false;
  /** Earliest time in [0, T] where f goes from positive to non-positive (an entering contact). */
  function firstEntry(c, T, touchTol, velTol) {
    lastPress = false;
    if (c[0] <= touchTol) {
      if (c[1] < -velTol) return 0;
      if (Math.abs(c[1]) <= velTol && c.length > 2 && c[2] < 0) { lastPress = true; return 0; }
      // Touching and separating only slowly: if they start closing again before the gap ever exceeds the
      // touch tolerance, report that moment (the next step then treats it as a pressing contact).
      if (c[1] > velTol && c.length > 2) {
        const dc = pDeriv(c), ddc = pDeriv(dc);
        for (const tc of rootsIn(dc, 0, T)) {
          if (pEval(ddc, tc) < 0) { if (pEval(c, tc) <= touchTol) return tc; break; }
        }
      }
    }
    const roots = rootsIn(c, 0, T);
    if (!roots.length) return Infinity;
    const dc = pDeriv(c);
    for (const r of roots) { if (pEval(dc, r) < 0) return r; }
    return Infinity;
  }

  /* ------------------------------------------------------------------ ball kinematics */
  function inertia(b) { return 0.4 * b.m * b.R * b.R; }
  function energy(b) {
    if (b.s === S.POCKETED) return 0;
    return 0.5 * b.m * (b.vx * b.vx + b.vy * b.vy) + 0.5 * inertia(b) * (b.wx * b.wx + b.wy * b.wy + b.wz * b.wz);
  }
  function classify(b) {
    if (b.s === S.POCKETED) return;
    const ux = b.vx - b.R * b.wy, uy = b.vy + b.R * b.wx;
    const um = hyp(ux, uy);
    if (um > EPS_U) { b.s = S.SLIDING; return; }
    // Residual slip below tolerance: remove it with the cloth-friction impulse that stops slip
    // (velocity changes by 2/7 of the slip, spin takes up the rest). This can only remove energy.
    if (um > 0) { b.vx -= 2 / 7 * ux; b.vy -= 2 / 7 * uy; }
    if (hyp(b.vx, b.vy) > EPS_V) { b.s = S.ROLLING; b.wx = -b.vy / b.R; b.wy = b.vx / b.R; return; }
    b.vx = b.vy = b.wx = b.wy = 0;
    if (Math.abs(b.wz) > EPS_W) b.s = S.SPINNING; else { b.wz = 0; b.s = S.STATIONARY; }
  }
  function accel(b, P, out) {
    out[0] = 0; out[1] = 0;
    if (b.s === S.SLIDING) {
      const ux = b.vx - b.R * b.wy, uy = b.vy + b.R * b.wx, um = hyp(ux, uy);
      if (um > 0) { const a = P.muSlide * P.g; out[0] = -a * ux / um; out[1] = -a * uy / um; }
    } else if (b.s === S.ROLLING) {
      const vm = hyp(b.vx, b.vy);
      if (vm > 0) { const a = P.muRoll * P.g; out[0] = -a * b.vx / vm; out[1] = -a * b.vy / vm; }
    }
    return out;
  }
  function spinDecel(b, P) { return 2.5 * P.muSpin * P.g / b.R; }
  function transitionTime(b, P) {
    switch (b.s) {
      case S.SLIDING: { const a = P.muSlide * P.g; return a > 0 ? 2 * hyp(b.vx - b.R * b.wy, b.vy + b.R * b.wx) / (7 * a) : Infinity; }
      case S.ROLLING: { const a = P.muRoll * P.g; return a > 0 ? hyp(b.vx, b.vy) / a : Infinity; }
      case S.SPINNING: { const a = spinDecel(b, P); return a > 0 ? Math.abs(b.wz) / a : Infinity; }
      default: return Infinity;
    }
  }
  function decaySpin(b, dt, P) {
    const dw = spinDecel(b, P) * dt;
    if (Math.abs(b.wz) <= dw) b.wz = 0; else b.wz -= Math.sign(b.wz) * dw;
  }
  /** Analytic evolution within the current motion state (dt must not pass the next transition). */
  function evolve(b, dt, P) {
    if (dt <= 0) return;
    if (b.s === S.SLIDING) {
      const ux = b.vx - b.R * b.wy, uy = b.vy + b.R * b.wx, um = hyp(ux, uy);

function MODEL_NOTES() {
  return h('div', { class: 'doc', html: `
<h2>Model notes</h2>
<h3>Units and frame</h3>
<p>Internally everything is SI: metres, seconds, kilograms and radians. The origin is the lower-left intersection of the cushion-nose lines; x runs along the long axis toward the right short rail, y toward the upper rail. Display units only change how numbers are shown.</p>
<h3>Ball motion</h3>
<p>Each ball carries position, planar velocity and a full three-axis angular velocity. Between events the motion is exact: sliding balls decelerate along their contact slip (μs), which bends the path when slip and velocity differ; rolling balls decelerate by rolling resistance (μr); sidespin decays at a constant rate (μsp). The sliding-to-rolling and rolling-to-rest moments are computed analytically.</p>
<h3>Cue strike</h3>
<p>The tip impact is instantaneous with tip restitution, cue mass and an optional cue elevation (Leckie and Greenspan form). Squirt uses Alciatore’s end-mass model. Swerve is not added as a curve: it emerges when an elevated cue gives spin about the travel direction, which the cloth friction turns into lateral acceleration. Swerve is uncalibrated, and full jump and massé shots are not supported.</p>
<h3>Ball–ball contact</h3>
<p>Normal restitution plus a Coulomb friction impulse at the contact, using the full 3D slip (cut, follow, draw and sidespin all contribute). The friction impulse uses the same effective masses as the velocity update: vertical ball motion (hop) is not modelled, so vertical slip at the contact is resisted by spin alone. If friction can stop the slip within the Coulomb limit it stops it exactly (“sticking”); otherwise it acts in small increments along the current slip direction and never reverses it, so throw and spin transfer can never add energy. The friction coefficient falls with slip speed (Alciatore TP A.14 fit). Vertical impulse on the ball (hop) is ignored.</p>
<h3>Cushions and jaws</h3>
<p>Mathavan, Jackson and Parkin (2010): the impact is integrated over the normal impulse with friction at the cushion contact (above the ball centre, set by nose height) and at the cloth, ending when the normal work returned equals e² times the work absorbed. Restitution falls with normal speed through an uncalibrated linear term. Facings and rounded jaw noses use the same model with their local normals.</p>
<h3>Pockets</h3>
<p>Each pocket has mouth jaws, angled facings (142° corners, 104° sides), a shelf and a circular slate hole. A ball is captured when its centre crosses the slate-hole edge. The fall itself, rattling against the pocket liner and drop-in after hanging on the lip are not simulated; balls that stop on the shelf stay in play.</p>
<h3>Collision detection</h3>
<p>Event-driven: contact times are found as roots of the exact motion polynomials (up to quartic) by recursive critical-point isolation, so fast balls cannot tunnel and results do not depend on frame rate or zoom. Simultaneous contacts are resolved one at a time in a fixed order; zero-time loops are capped. When balls stay pressed together, or a ball is pressed into a cushion by its spin, the contact is integrated in 0.2 ms sub-steps with inelastic contact impulses and friction. This conserves the momentum exchanged between touching balls; transient overlap stays below 1 µm. Frozen-ball compression shots use sequential impulses, not a compliant cushion; compression shots into frozen clusters are therefore approximate.</p>
<h3>Suggested shots</h3>
<p>Mirror and ghost-ball constructions only seed the search. For each route, tip and speed, the solver scans the object-ball departure angle (or the kick heading), brackets the shot that sends the ball through the pocket centre, measures the aim window, and re-tests each candidate under declared perturbations. Results are simulated tolerance under current coefficients; “no solution” only means none within the search limits.</p>
<h3>Several targets</h3>
<p>Up to three target balls are shot in order. Target 1 is the ball the cue ball must hit first. For the remaining targets the engine reports whether they are hit, moved or pocketed, and estimates the next shot from the cue ball’s predicted finish with straight ghost-ball geometry: cut angle, pocket angle, distance and blocking balls. That estimate ignores spin and throw. Suggested shots can weigh it as position play and penalise disturbing remaining targets. After a shot that pockets target 1, “Continue to ball n” keeps the result and makes the next target active.</p>
<h3>Not modelled</h3>
<ul><li>Cue-tip double hits (needs a cue-motion and contact-duration model).</li><li>Jump and massé shots, airborne balls and ball hop.</li><li>Cloth nap, table roll and humidity.</li><li>A behind-the-cue 3D view (optional in the spec, not included).</li></ul>
<h3>Calibration status</h3>
<p>Dimensions follow the WPA equipment specification. Friction, restitution and squirt coefficients are literature-typical or assumed values and are labelled uncalibrated in the Physics tab. No quantitative accuracy is claimed until these are fitted to measured trajectories and angle errors are published for a stated shot range.</p>
<h3>Running locally</h3>
<p>This is a single HTML file with no build step and no required dependencies (Google Fonts is optional). Open it in a current browser, or serve the folder with <code>python3 -m http.server</code>. Suggested-shot searches run in a Web Worker when the browser allows one and fall back to the main thread otherwise.</p>` });
}

  const geom = Object.assign(Phys.defaultGeometry(), o.geometry && typeof o.geometry === 'object' ? o.geometry : {});

  const params = Object.assign(Phys.defaultParams(), o.physics && o.physics.params && typeof o.physics.params === 'object' ? o.physics.params : {});

  }
  if (!ids.has('cue')) fail('The scenario has no cue ball.');
  const objs = balls.filter(b => b.kind === 'object');
  if (!objs.length) fail('The scenario needs at least one object ball.');
  const shot = Object.assign({ aim: 0, tipX: 0, tipY: 0, cueSpeed: 2.5, elevation: 0 }, o.shot && typeof o.shot === 'object' ? o.shot : {});
  const checkShot = (s, what) => {

    if (s.elevation < 0 || s.elevation > 15 * D2R + 1e-9) fail(`${what}: cue elevation must be between 0° and 15°.`);

const store = {

    return [...store.mem.keys()].map(k => k.replace(/^scenario:/, ''));

    if (store.has()) { try { const r = await window.storage.get(k, false); if (r && r.value) return r.value; } catch (e) { /* fall through */ } }
    return store.mem.get(k) || null;

};
